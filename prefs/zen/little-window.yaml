- name: zen.little-window.enabled
  value: true

- name: zen.little-window.width
  value: 960

- name: zen.little-window.height
  value: 680

- name: zen.little-window.open-external-links
  value: true

# Where the last little window was left, as "x,y". Empty to center them.
- name: zen.little-window.position
  value: ""

# On macOS, the shortcut for little windows also works from other apps.
- name: zen.little-window.global-shortcut
  value: true

# "cyber": sky blue and white with cyan glows, after Blue Archive.
# "space": the space's own colors, as Little Arc does.
- name: zen.little-window.theme
  value: "cyber"

# On macOS, keep a little window ready out of sight, so the next one shows at
# once instead of starting up first.
- name: zen.little-window.preload
  value: true
